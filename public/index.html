<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Lab 10</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #007bff; color: white; }
        .btn-eliminar { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .btn-eliminar:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista de Productos</h1>
        
        <!-- Formulario para agregar -->
        <form id="formulario">
            <input type="text" id="nombre" placeholder="Nombre del producto" required>
            <input type="number" id="precio" placeholder="Precio" step="0.01" required>
            <input type="number" id="stock" placeholder="Stock" required>
            <button type="submit">Agregar Producto</button>
        </form>

        <!-- Tabla de productos -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos">
                <!-- Aquí JavaScript insertará los datos -->
            </tbody>
        </table>
    </div>

    <!-- Lógica de JavaScript -->
    <script>
        const API_URL = '/api/productos';
        const tabla = document.getElementById('tabla-productos');
        const formulario = document.getElementById('formulario');

        // 1. Cargar productos (GET)
        async function cargarProductos() {
            const res = await fetch(API_URL);
            const productos = await res.json();
            tabla.innerHTML = '';
            
            productos.forEach(prod => {
                tabla.innerHTML += `
                    <tr>
                        <td>${prod.id}</td>
                        <td>${prod.nombre}</td>
                        <td>S/ ${prod.precio}</td>
                        <td>${prod.stock}</td>
                        <td><button class="btn-eliminar" onclick="eliminarProducto(${prod.id})">Eliminar</button></td>
                    </tr>
                `;
            });
        }

        // 2. Agregar producto (POST)
        formulario.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            const nuevoProducto = {
                nombre: document.getElementById('nombre').value,
                precio: parseFloat(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value)
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoProducto)
            });

            formulario.reset();
            cargarProductos(); // Recargar la tabla
        });

        // 3. Eliminar producto (DELETE)
        async function eliminarProducto(id) {
            if(confirm('¿Seguro que deseas eliminar este producto?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                cargarProductos(); // Recargar la tabla
            }
        }

        // Iniciar al cargar la página
        cargarProductos();
    </script>
</body>
</html>
